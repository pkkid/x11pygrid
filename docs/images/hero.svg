<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Animation: pressing Ctrl+Alt with numpad keys 4, 9 and 0 snaps a window to the left third, left two thirds, top right, and then maximizes it.">
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --accent:#0969da; --box:#f6f8fa; --line:#d0d7de; --win:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --accent:#4493f8; --box:#161b22; --line:#30363d; --win:#0d1117; }
    }
    .bg     { fill: var(--bg); }
    .box    { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .screen { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    .grid   { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
    .accent { fill: var(--accent); }
    .win    { fill: var(--win); stroke: var(--accent); stroke-width: 2; }
    .text   { fill: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .muted  { fill: var(--muted); font: 12px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .mono   { fill: var(--fg); font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .key    { fill: var(--fg); font: 600 15px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }

    .still { display: none; }
    @media (prefers-reduced-motion: reduce) { .anim { display: none; } .still { display: inline; } }
  </style>
